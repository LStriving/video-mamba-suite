dataset_name: heatmap_rawdata
train_split: ['train']
val_split: ['validation']
model_name: E2Eformer
dataset: {
  json_file: ./data/swallow/anno/swallow_stage2_trainval.json,
  # feat_folder: ./data/swallow/stage_2/resnet50_keypointfeat_56,
  feat_folder: data/swallow/stage_2/raw_heatmap_sigma4,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 1,
  input_dim: 576,
  feature_type: "",
  # feature_type: "_spatial_feature",
  #2048+768, 1024+768,1280+1024
  feat_stride: 3,
  num_frames: 8,
  # serve as data augmentation
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  max_seq_len: 192,
  two_stage: True,
  stage_at: 2,
  desired_actions: [OralDelivery, SoftPalateLift, HyoidExercise, UESOpen, ThroatSwallow, ThroatTransport, LaryngealVestibuleClosure],
  resize_to: 56,
}
model: {
  backbone_type: tridet,
  fpn_type: identity,
  max_buffer_len_factor: 6.0,
  backbone_arch: [ 2, 2, 3 ],
  n_sgp_win_size: 1,
  regression_range: [ [ 0, 4 ], [ 4, 8 ], [ 8, 16 ], [ 16, 10000 ] ],
  num_bins: 16,
  k: 5,
  iou_weight_power: 0.2,
  use_trident_head: True,
  sgp_mlp_dim: 768,
  input_noise: 0.0005,
  backbone_type: SGP,
  scale_factor: 2,
  embd_kernel_size: 3,
  embd_dim: 512,
  embd_with_ln: True,
  fpn_dim: 512,
  fpn_with_ln: True,
  head_dim: 512,
  head_kernel_size: 3,
  boudary_kernel_size: 3,
  head_num_layers: 3,
  head_with_ln: True,
  use_abs_pe: False,
  downsample_type: "max",
  init_conv_vars: 0,
}
opt: {
  learning_rate: 0.0001,
  epochs: 45,
  weight_decay: 0.05,
  warmup: True,
  warmup_epochs: 5,
}
loader: {
  batch_size: 16,
  accum_steps: 2,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  droppath: 0.1,
}
# the inference on THUMOS is quite different from EPIC-kitchens
# a major performance gain is achieved by fusing external classification scores
# doing so will require disable multiclass_nms and enable score fusion
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 200,
  min_score: 0.001,
  # when using external scores, our model is generating "proposals"
  # multiclass_nms: False,
  # ext_score_file: ./data/thumos/annotations/thumos14_cls_scores.pkl,
  # comment out L47-48 and uncomment L50 to disable score fusion
  multiclass_nms: True,
}
video_stem: {
  image_size: 56,
  in_channels: 1,
  num_frames: 8,
  patch_size: 7,
  embed_dim: 576,
  drop_path_rate: 0.1,
  num_layers: 3,
  feature_output_method: avg,
  act_checkpoint: True,
}
keypoint: {
  sigma: 4,
}
output_folder: ./ckpts/link2/e2e_heatmap_stage2_video_mamba_l3_ep45_sigma4_hid576_tridet/