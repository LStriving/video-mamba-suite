dataset_name: swallow
model_name: TriDet
train_split: [ 'train' ]
val_split: [ 'validation' ]
dataset: {
  json_file: ./data/swallow/anno/swallow_stage2_trainval.json,
  feat_folder: ./data/swallow/stage_2/rgb_flow_no_interplote/no_interplote,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 1,
  input_dim: 2048,
  feat_stride: 3,
  num_frames: 8,
  # serve as data augmentation
  trunc_thresh: 0.5,
  crop_ratio: [ 0.9, 1.0 ],
  max_seq_len: 432,
  two_stage: True,
  stage_at: 2,
  desired_actions: [OralDelivery, SoftPalateLift, HyoidExercise, UESOpen, ThroatSwallow, ThroatTransport, LaryngealVestibuleClosure],
}
model: {
  fpn_type: identity,
  max_buffer_len_factor: 6.0,
  backbone_arch: [ 2, 2, 3 ],
  n_sgp_win_size: 1,
  regression_range: [ [ 0, 4 ], [ 4, 8 ], [ 8, 16 ], [ 16, 10000 ] ],
  num_bins: 16,
  k: 5,
  iou_weight_power: 0.2,
  use_trident_head: True,
  sgp_mlp_dim: 768,
  input_noise: 0.0005,
  backbone_type: SGP,
  scale_factor: 2,
  embd_kernel_size: 3,
  embd_dim: 512,
  embd_with_ln: True,
  fpn_dim: 512,
  fpn_with_ln: True,
  head_dim: 512,
  head_kernel_size: 3,
  boudary_kernel_size: 3,
  head_num_layers: 3,
  head_with_ln: True,
  use_abs_pe: False,
  downsample_type: "max",
  init_conv_vars: 0,
}
opt: {
  learning_rate: 0.0001,
  warmup_epochs: 5,
  epochs: 30,
  weight_decay: 0.05,
}
loader: {
  batch_size: 2,
}
train_cfg: {
  init_loss_norm: 100,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
}
# the inference on THUMOS is quite different from EPIC-kitchens
# a major performance gain is achieved by fusing external classification scores
# doing so will require disable multiclass_nms and enable score fusion
test_cfg: {
  voting_thresh: 0.7,
  pre_nms_topk: 2000,
  max_seg_num: 2000,
  min_score: 0.001,
  multiclass_nms: True,
}
output_folder: /mnt/cephfs/dataset/swallow_ckpt/tridet_swallow_second_stage/
